[project]
name = "spellforge"
version = "0.1.0"
description = ""
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "requests",
    "python-dotenv",
    "pydantic",
    "pypdf",
]

[tool.ruff]
# Use tabs for indentation — matches project coding standards
indent-width = 4
line-length  = 100

[tool.ruff.format]
# Enforce tabs, not spaces, as required by coding guidelines
indent-style = "tab"

[tool.ruff.lint]
# E/W = pycodestyle, F = pyflakes, I = isort import sorting
select = ["E", "F", "I", "W"]

# Rules we deliberately ignore:
#   E501 — line too long (we trust developers on long strings/comments)
#   E303 — too many blank lines (occasionally useful for readability)
ignore = ["E501", "E303", "W191", "E101"]

[tool.pytest.ini_options]
# Discover all tests/ directories recursively
testpaths = ["tests"]
# Measure coverage of spellforge.py only. Threshold is 25% because the
# subprocess-heavy install/ensure/verify functions (~75% of lines) cannot
# be meaningfully unit-tested without live tools. The unit tests in
# test_spellforge_unit.py cover all content-generation and pure helper
# functions; the threshold prevents untested code from being silently added.
addopts = "--cov=spellforge --cov-report=term-missing --cov-fail-under=24"

[tool.coverage.run]
omit = ["old_spellforge.py"]

[tool.bandit]
# Skip test files - they intentionally use patterns bandit flags
exclude_dirs = ["tests", ".venv"]
# Only report medium severity and above - low is too noisy for most projects
skips = ["B101"]  # B101 = assert used - fine in non-production code
